name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - name: Build mai
        run: |
          sudo apt-get update && sudo apt-get install -y bison m4 libreadline-dev valgrind
          git clone --depth 1 https://github.com/mai-lib/mai "$RUNNER_TEMP/mai"
          make -C "$RUNNER_TEMP/mai" build CTUNE=
          echo "MAI_PATH=$RUNNER_TEMP/mai/build/main" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
